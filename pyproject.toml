[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "koord-mcp"
version = "0.1.0"
description = "MCP server with ephemeral channel broadcasts and interactive Codex sessions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3", "python-dotenv>=1.2,<2"]

[project.scripts]
koord-mcp = "server:main"
koord = "koord_cli:main"

[tool.setuptools]
py-modules = ["server", "codex_sessions", "codex_session_hook", "koord_cli"]
